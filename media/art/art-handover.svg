<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#0d2f78"/><stop offset=".55" stop-color="#071a4a"/><stop offset="1" stop-color="#030a22"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d7bff" stop-opacity=".28"/><stop offset="1" stop-color="#1a3d9e" stop-opacity=".16"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b3f9c" stop-opacity=".6"/><stop offset="1" stop-color="#0c2366" stop-opacity=".6"/></linearGradient>
  <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4fd8ff" stop-opacity=".25"/><stop offset="1" stop-color="#7ef0ff"/></linearGradient>
  <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#bff6ff"/><stop offset=".35" stop-color="#3fc7ff"/><stop offset="1" stop-color="#1557d6" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  <style>
.flow{stroke-dasharray:6 14;animation:flow 1.6s linear infinite}
.flow.b{animation-duration:2.1s}.flow.c{animation-duration:1.2s}
@keyframes flow{to{stroke-dashoffset:-40}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.08);opacity:.7}}
.spin{animation:spin 16s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.shimmer{animation:shimmer 3s ease-in-out infinite}
.d1{animation-delay:.3s}.d2{animation-delay:.6s}.d3{animation-delay:.9s}.d4{animation-delay:1.2s}.d5{animation-delay:1.5s}
@keyframes shimmer{50%{opacity:.45}}
.float{animation:float 5s ease-in-out infinite}
.float.late{animation-delay:-2.5s}
@keyframes float{50%{transform:translateY(-10px)}}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.msg,.row,.q,.a,.ok,.paid,.rowin,.stamp{opacity:1!important}.sig,.line,.strike{stroke-dashoffset:0!important}}
.scan{animation:scan 3.2s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(300px)}}
   .row{opacity:0;animation:row 7s infinite}
   .r0{animation-delay:0s}.r1{animation-delay:0.45s}.r2{animation-delay:0.9s}.r3{animation-delay:1.35s}.r4{animation-delay:1.8s}.r5{animation-delay:2.25s}
   @keyframes row{0%{opacity:0;transform:translateX(-12px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}</style>
