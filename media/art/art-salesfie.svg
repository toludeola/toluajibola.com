<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0d2f78"/>
      <stop offset="0.55" stop-color="#071a4a"/>
      <stop offset="1" stop-color="#030a22"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d7bff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1a3d9e" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3f9c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0c2366" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd8ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7ef0ff"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bff6ff"/>
      <stop offset="0.35" stop-color="#3fc7ff"/>
      <stop offset="1" stop-color="#1557d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <style>
      .flow { stroke-dasharray: 6 14; animation: flow 1.6s linear infinite; }
      .flow.b { animation-duration: 2.1s; }
      .flow.c { animation-duration: 1.3s; }
      @keyframes flow { to { stroke-dashoffset: -40; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 640px 512px; }
      @keyframes pulse { 50% { transform: scale(1.08); opacity: 0.75; } }
      .spin { animation: spin 14s linear infinite; transform-origin: 640px 512px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .shimmer { animation: shimmer 3s ease-in-out infinite; }
      .shimmer.d2 { animation-delay: 0.4s; } .shimmer.d3 { animation-delay: 0.8s; } .shimmer.d4 { animation-delay: 1.2s; }
      @keyframes shimmer { 50% { opacity: 0.45; } }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-10px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>

  <!-- perspective floor -->
  <g stroke="#3b82f6" stroke-opacity="0.18" stroke-width="1">
    <path d="M0 760 H1536 M0 810 H1536 M0 875 H1536 M0 955 H1536"/>
    <path d="M768 700 L-400 1024 M768 700 L-60 1024 M768 700 L260 1024 M768 700 L560 1024 M768 700 L768 1024 M768 700 L976 1024 M768 700 L1276 1024 M768 700 L1596 1024 M768 700 L1936 1024"/>
  </g>

  <!-- stars -->
  <g fill="#9fd8ff">
    <circle cx="120" cy="90" r="1.6" opacity="0.7"/><circle cx="310" cy="160" r="1.2" opacity="0.5"/><circle cx="520" cy="70" r="1.8" opacity="0.6"/>
    <circle cx="760" cy="140" r="1.3" opacity="0.6"/><circle cx="980" cy="80" r="1.6" opacity="0.5"/><circle cx="1200" cy="130" r="1.2" opacity="0.7"/>
    <circle cx="1420" cy="70" r="1.8" opacity="0.6"/><circle cx="1470" cy="300" r="1.3" opacity="0.5"/><circle cx="60" cy="420" r="1.4" opacity="0.5"/>
    <circle cx="700" cy="300" r="1.2" opacity="0.5"/><circle cx="420" cy="880" r="1.5" opacity="0.4"/><circle cx="1350" cy="900" r="1.4" opacity="0.4"/>
  </g>

  <!-- wires: sources to core -->
  <g fill="none" stroke="url(#wire)" stroke-width="2.5" filter="url(#glow)">
    <path class="flow" d="M352 246 C 480 246, 520 470, 600 500"/>
    <path class="flow b" d="M352 366 C 470 366, 520 490, 596 506"/>
    <path class="flow c" d="M352 486 C 450 486, 520 510, 590 512"/>
    <path class="flow b" d="M352 606 C 470 606, 520 530, 596 518"/>
    <path class="flow" d="M352 726 C 480 726, 520 556, 600 524"/>
  </g>
  <!-- wire: core to brief -->
  <g fill="none" stroke="#7ef0ff" stroke-width="3" filter="url(#glow)">
    <path class="flow c" d="M736 512 C 800 512, 820 470, 880 470"/>
  </g>

  <!-- source chips -->
  <g font-size="22" font-weight="600" fill="#e6f3ff">
    <g>
      <rect x="92" y="210" width="260" height="72" rx="18" fill="url(#glass)" stroke="#5fb4ff" stroke-opacity="0.6"/>
      <circle cx="132" cy="246" r="20" fill="#00a1e0"/><path d="M122 250 a8 8 0 0 1 6-12 a9 9 0 0 1 15 2 a7 7 0 0 1 3 13 h-22 a5 5 0 0 1 -2 -3z" fill="#fff"/>
      <text x="166" y="254">Salesforce</text>
    </g>
    <g>
      <rect x="92" y="330" width="260" height="72" rx="18" fill="url(#glass)" stroke="#5fb4ff" stroke-opacity="0.6"/>
      <circle cx="132" cy="366" r="20" fill="#ff7a59"/><circle cx="135" cy="368" r="6" fill="none" stroke="#fff" stroke-width="3"/><path d="M135 362 v-8 M139 371 l6 5 M130 365 l-6 -4" stroke="#fff" stroke-width="3"/>
      <text x="166" y="374">HubSpot</text>
    </g>
    <g>
      <rect x="92" y="450" width="260" height="72" rx="18" fill="url(#glass)" stroke="#5fb4ff" stroke-opacity="0.6"/>
      <circle cx="132" cy="486" r="20" fill="#ea4335"/><path d="M121 479 h22 v15 h-22z M121 479 l11 9 l11 -9" fill="none" stroke="#fff" stroke-width="2.5"/>
      <text x="166" y="494">Gmail</text>
    </g>
    <g>
      <rect x="92" y="570" width="260" height="72" rx="18" fill="url(#glass)" stroke="#5fb4ff" stroke-opacity="0.6"/>
      <circle cx="132" cy="606" r="20" fill="#4285f4"/><rect x="122" y="597" width="20" height="18" rx="3" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M122 603 h20" stroke="#fff" stroke-width="2.5"/>
      <text x="166" y="614">Calendar</text>
    </g>
    <g>
      <rect x="92" y="690" width="260" height="72" rx="18" fill="url(#glass)" stroke="#5fb4ff" stroke-opacity="0.6"/>
      <circle cx="132" cy="726" r="20" fill="#4a154b"/><path d="M124 722 h16 M124 730 h16 M128 718 v16 M136 718 v16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="166" y="734">Slack threads</text>
    </g>
  </g>

  <!-- AI core -->
  <circle cx="640" cy="512" r="150" fill="url(#core)" opacity="0.35" filter="url(#soft)" class="pulse"/>
  <circle cx="640" cy="512" r="96" fill="none" stroke="#5fd6ff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="4 10" class="spin"/>
  <circle cx="640" cy="512" r="70" fill="#0b2c7a" stroke="#7ef0ff" stroke-width="3" filter="url(#glow)"/>
  <text x="640" y="526" text-anchor="middle" font-size="40" font-weight="700" fill="#dff8ff" letter-spacing="1">AI</text>
  <text x="640" y="640" text-anchor="middle" font-size="18" font-weight="600" fill="#9fd8ff" letter-spacing="3">CONTEXT ENGINE</text>

  <!-- brief card -->
  <g class="float">
    <rect x="880" y="190" width="560" height="620" rx="28" fill="url(#card)" stroke="#7ec8ff" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="880" y="190" width="560" height="620" rx="28" fill="none" stroke="#7ef0ff" stroke-opacity="0.25" stroke-width="8" filter="url(#glow)"/>
    <rect x="916" y="226" width="56" height="56" rx="14" fill="#e9f4ff"/>
    <circle cx="944" cy="254" r="14" fill="none" stroke="#1557d6" stroke-width="4"/><circle cx="944" cy="254" r="5" fill="#1557d6"/>
    <text x="990" y="250" font-size="24" font-weight="700" fill="#ffffff">DT Salesfie</text>
    <rect x="1132" y="230" width="52" height="24" rx="6" fill="#ffffff" fill-opacity="0.15"/>
    <text x="1158" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#cfe6ff">APP</text>
    <text x="990" y="278" font-size="18" fill="#9fc4ff">08:30 · Meeting prep</text>
    <text x="916" y="336" font-size="26" font-weight="700" fill="#ffffff">Prep: your 10:00 client call</text>

    <g font-size="17" font-weight="700" letter-spacing="1.5">
      <rect x="916" y="368" width="14" height="14" rx="3" fill="#4fd8ff"/><text x="942" y="381" fill="#bfe6ff">DEAL STATUS</text>
      <rect class="shimmer" x="916" y="396" width="470" height="12" rx="6" fill="#ffffff" fill-opacity="0.28"/>
      <rect class="shimmer d2" x="916" y="418" width="380" height="12" rx="6" fill="#ffffff" fill-opacity="0.2"/>

      <rect x="916" y="460" width="14" height="14" rx="3" fill="#a78bfa"/><text x="942" y="473" fill="#d9ccff">RECENT ACTIVITY</text>
      <rect class="shimmer d2" x="916" y="488" width="490" height="12" rx="6" fill="#ffffff" fill-opacity="0.24"/>
      <rect class="shimmer d3" x="916" y="510" width="430" height="12" rx="6" fill="#ffffff" fill-opacity="0.2"/>
      <rect class="shimmer d4" x="916" y="532" width="300" height="12" rx="6" fill="#ffffff" fill-opacity="0.16"/>

      <rect x="916" y="574" width="14" height="14" rx="3" fill="#fbbf24"/><text x="942" y="587" fill="#ffe3a3">RISKS / BLOCKERS</text>
      <rect class="shimmer d3" x="916" y="602" width="460" height="12" rx="6" fill="#fbbf24" fill-opacity="0.35"/>
      <rect class="shimmer d4" x="916" y="624" width="340" height="12" rx="6" fill="#fbbf24" fill-opacity="0.25"/>

      <rect x="916" y="666" width="14" height="14" rx="3" fill="#34d399"/><text x="942" y="679" fill="#bff5df">TALKING POINTS</text>
      <rect class="shimmer" x="916" y="694" width="480" height="12" rx="6" fill="#34d399" fill-opacity="0.35"/>
      <rect class="shimmer d2" x="916" y="716" width="400" height="12" rx="6" fill="#34d399" fill-opacity="0.25"/>
    </g>
    <g>
      <rect x="1268" y="752" width="146" height="36" rx="18" fill="#22c55e" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.7"/>
      <text x="1341" y="776" text-anchor="middle" font-size="16" font-weight="700" fill="#bff5df">✓ Delivered</text>
    </g>
  </g>

  <!-- ask anything bubble -->
  <g class="float" style="animation-delay:-2.5s">
    <rect x="760" y="844" width="470" height="76" rx="38" fill="#0e2a6e" stroke="#7ec8ff" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="800" cy="882" r="20" fill="#4fd8ff" fill-opacity="0.25" stroke="#7ef0ff"/>
    <text x="800" y="889" text-anchor="middle" font-size="20" font-weight="700" fill="#dff8ff">@</text>
    <text x="834" y="890" font-size="21" fill="#e6f3ff">salesfie, what changed on this deal?</text>
  </g>

  <!-- top badge -->
  <g>
    <rect x="980" y="120" width="360" height="44" rx="22" fill="#0b2c7a" stroke="#7ef0ff" stroke-opacity="0.6"/>
    <circle cx="1006" cy="142" r="7" fill="#34d399"/>
    <text x="1024" y="149" font-size="18" font-weight="600" fill="#cfe6ff">3 client calls today · briefs ready</text>
  </g>
</svg>
