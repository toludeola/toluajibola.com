<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="96" height="96"><style>
svg{fill:none;stroke:#ff5a1f;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
circle{fill:#ff5a1f;stroke:none}
circle.ring{fill:none;stroke:#ff5a1f;transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}
.lane,.target{stroke-dasharray:3 4;opacity:.5}
.draw{stroke-dasharray:60;animation:draw 3.2s cubic-bezier(.16,1,.3,1) infinite}
.flow{stroke-dasharray:2 5;animation:flow 1.4s linear infinite}.f2{animation-delay:-.45s}.f3{animation-delay:-.9s}
.sync{animation:sync 2.8s ease-in-out infinite}.s2{animation-delay:.35s}
@keyframes draw{0%{stroke-dashoffset:60}60%,100%{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes sync{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%,55%{transform:scale(.6);opacity:0}62%{opacity:1}100%{transform:scale(2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.mover{display:none}}
</style><path class="lane" d="M6 16 H 58 M6 32 H 58 M6 48 H 58"/><path d="M10 16 H 22 Q 26 16 26 20 V 28 Q 26 32 30 32 H 38 Q 42 32 42 36 V 44 Q 42 48 46 48 H 54"/><circle cx="10" cy="16" r="3.4"/><circle cx="26" cy="24" r="2.4"/><circle cx="42" cy="40" r="2.4"/><circle class="ring" cx="54" cy="48" r="4"/><circle class="mover" r="2.6"><animateMotion dur="3.2s" repeatCount="indefinite" path="M10 16 H 22 Q 26 16 26 20 V 28 Q 26 32 30 32 H 38 Q 42 32 42 36 V 44 Q 42 48 46 48 H 54" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="spline" keySplines="0.45 0 0.25 1;0 0 1 1"/></circle></svg>
